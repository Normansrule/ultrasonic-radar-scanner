<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-label="Callout: ECHO voltage divider and the fuse on battery positive">
<defs>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4dfb6"/><stop offset="0.5" stop-color="#e2c38c"/><stop offset="1" stop-color="#b99a62"/></linearGradient>
<linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d6fb8"/><stop offset="1" stop-color="#124a7c"/></linearGradient>
<linearGradient id="cell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82c4"/><stop offset="0.45" stop-color="#9cc7ef"/><stop offset="1" stop-color="#1f4e7a"/></linearGradient>
<linearGradient id="holder" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#111"/></linearGradient>
<linearGradient id="fuse" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b197fc"/><stop offset="1" stop-color="#6741d9"/></linearGradient>
<radialGradient id="can" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#f1f3f5"/><stop offset="1" stop-color="#868e96"/></radialGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/></filter>
</defs>
<rect width="1100" height="520" fill="#fbfaf7"/>
<text x="30" y="38" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:22px;font-weight:bold" fill="#111">Two details that protect the build</text>
<text x="30" y="62" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:13px" fill="#555">Illustration (not a photo). Resistor colour bands shown for 5-band 1 % parts.</text>
<g filter="url(#sh)"><rect x="30" y="85" width="500" height="405" rx="14" fill="#fff" stroke="#ddd"/></g>
<text x="50" y="115" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:16px;font-weight:bold" fill="#1f3b2d">A · ECHO divider (5 V → ≈3 V)</text>
<g filter="url(#sh)"><rect x="60" y="140" width="190" height="90" rx="6" fill="url(#pcb)"/></g>
<circle cx="105" cy="185" r="34" fill="url(#can)" stroke="#495057" stroke-width="2"/>
<circle cx="105" cy="185" r="22" fill="#343a40" opacity="0.85"/>
<circle cx="205" cy="185" r="34" fill="url(#can)" stroke="#495057" stroke-width="2"/>
<circle cx="205" cy="185" r="22" fill="#343a40" opacity="0.85"/>
<rect x="103" y="230" width="6" height="22" fill="#ced4da"/>
<text x="106" y="225" text-anchor="middle" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:9px;font-weight:bold" fill="#fff">VCC</text>
<rect x="133" y="230" width="6" height="22" fill="#ced4da"/>
<text x="136" y="225" text-anchor="middle" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:9px;font-weight:bold" fill="#fff">TRIG</text>
<rect x="163" y="230" width="6" height="22" fill="#ced4da"/>
<text x="166" y="225" text-anchor="middle" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:9px;font-weight:bold" fill="#fff">ECHO</text>
<rect x="193" y="230" width="6" height="22" fill="#ced4da"/>
<text x="196" y="225" text-anchor="middle" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:9px;font-weight:bold" fill="#fff">GND</text>
<path d="M 166 252 L 166 300 L 250 300" stroke="#e67700" stroke-width="4" fill="none"/>
<g transform="translate(312,300)">
<line x1="-62" y1="0" x2="62" y2="0" stroke="#a7a9ac" stroke-width="3"/>
<rect x="-34" y="-11" width="68" height="22" rx="10" fill="url(#body)" stroke="#8d7a5a"/>
<rect x="-24" y="-11" width="5" height="22" fill="#d11f1f"/>
<rect x="-13" y="-11" width="5" height="22" fill="#d11f1f"/>
<rect x="-2" y="-11" width="5" height="22" fill="#111"/>
<rect x="9" y="-11" width="5" height="22" fill="#7a4a1d"/>
<rect x="26" y="-11" width="5" height="22" fill="#7a4a1d"/>
</g>
<path d="M 374 300 L 420 300" stroke="#2f9e44" stroke-width="4" fill="none"/>
<circle cx="420" cy="300" r="7" fill="#2f9e44"/>
<path d="M 420 300 L 490 300" stroke="#2f9e44" stroke-width="4" fill="none"/>
<g transform="translate(420,362) rotate(90)">
<line x1="-62" y1="0" x2="62" y2="0" stroke="#a7a9ac" stroke-width="3"/>
<rect x="-34" y="-11" width="68" height="22" rx="10" fill="url(#body)" stroke="#8d7a5a"/>
<rect x="-24" y="-11" width="5" height="22" fill="#f08c00"/>
<rect x="-13" y="-11" width="5" height="22" fill="#f08c00"/>
<rect x="-2" y="-11" width="5" height="22" fill="#111"/>
<rect x="9" y="-11" width="5" height="22" fill="#7a4a1d"/>
<rect x="26" y="-11" width="5" height="22" fill="#7a4a1d"/>
</g>
<path d="M 420 424 L 420 450 L 196 450 L 196 252" stroke="#111" stroke-width="4" fill="none"/>
<text x="505" y="287" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold" fill="#2f9e44" text-anchor="end">to GPIO26 →</text>
<text x="312" y="280" text-anchor="middle" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:bold" fill="#333">R1 2.2 kΩ</text>
<text x="438" y="366" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:bold" fill="#333">R2 3.3 kΩ</text>
<text x="300" y="472" text-anchor="middle" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:12px" fill="#111">common GND</text>
<rect x="275" y="135" width="238" height="100" rx="8" fill="#ebfbee" stroke="#2f9e44"/>
<text x="287" y="158" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold" fill="#1b5e20">Vout = Vin·R2/(R1+R2)</text>
<text x="287" y="180" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:13px" fill="#1b5e20">= 5.0 × 3.3 / 5.5 ≈ 3.00 V</text>
<text x="287" y="202" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:12px" fill="#1b5e20">Never wire ECHO straight to a</text>
<text x="287" y="219" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:12px" fill="#1b5e20">GPIO: the ESP32 is 3.3 V logic.</text>
<g filter="url(#sh)"><rect x="560" y="85" width="510" height="405" rx="14" fill="#fff" stroke="#ddd"/></g>
<text x="580" y="115" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:16px;font-weight:bold" fill="#1f3b2d">B · 3 A fuse on battery + (mandatory)</text>
<g filter="url(#sh)"><rect x="600" y="150" width="300" height="70" rx="8" fill="url(#holder)"/></g>
<rect x="620" y="162" width="258" height="46" rx="20" fill="url(#cell)"/>
<rect x="872" y="175" width="10" height="20" rx="2" fill="#adb5bd"/>
<text x="750" y="190" text-anchor="middle" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold" fill="#fff">protected 18650</text>
<text x="905" y="160" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:18px;font-weight:bold" fill="#e03131">+</text>
<text x="585" y="160" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:18px;font-weight:bold" fill="#111">−</text>
<path d="M 900 185 L 960 185 L 960 270" stroke="#e03131" stroke-width="5" fill="none"/>
<g filter="url(#sh)"><rect x="928" y="270" width="64" height="104" rx="12" fill="#212529"/></g>
<rect x="942" y="296" width="36" height="52" rx="4" fill="url(#fuse)"/>
<text x="960" y="327" text-anchor="middle" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold" fill="#fff">3A</text>
<path d="M 960 374 L 960 440 L 820 440" stroke="#e03131" stroke-width="5" fill="none"/>
<text x="812" y="444" text-anchor="end" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold" fill="#e03131">to DFR1026 BAT+</text>
<path d="M 600 185 L 580 185 L 580 400 L 640 400" stroke="#111" stroke-width="5" fill="none"/>
<text x="648" y="404" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold" fill="#111">to DFR1026 battery GND</text>
<rect x="600" y="245" width="300" height="120" rx="8" fill="#fff5f5" stroke="#e03131"/>
<text x="612" y="268" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#7d1a1a">Fuse first, as close to the holder as practical.</text>
<text x="612" y="289" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#7d1a1a">Insulated holder; heat-shrink every joint.</text>
<text x="612" y="310" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#7d1a1a">Never solder to the cell; never series two cells.</text>
<text x="612" y="331" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#7d1a1a">Strap the HOLDER, not the cell; nothing sharp</text>
<text x="612" y="352" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#7d1a1a">against the cell wrapping.</text>
</svg>
