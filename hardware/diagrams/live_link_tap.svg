<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Listen-only telemetry tap: ESP32 TX0 and GND to a 3.3 V USB-serial adapter">
<rect width="1000" height="380" fill="#ffffff"/>
<text x="30" y="38" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:21px;font-weight:bold" fill="#111">Live link — listen-only telemetry tap (optional)</text>
<text x="30" y="62" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:13px" fill="#555">Two wires. The ESP32's own USB port stays unplugged while the battery harness is connected.</text>
<rect x="40" y="95" width="300" height="230" rx="10" fill="#1f2a24" stroke="#0e1511" stroke-width="2"/>
<text x="60" y="125" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold" fill="#d9f7e3">ESP32-WROOM-32 DevKit</text>
<text x="60" y="146" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:12px" fill="#9fb3a8">powered by the scanner battery</text>
<rect x="320" y="176" width="24" height="18" rx="3" fill="#ced4da"/>
<text x="306" y="190" text-anchor="end" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:bold" fill="#e9fbe9">TX0 / GPIO1</text>
<rect x="320" y="236" width="24" height="18" rx="3" fill="#ced4da"/>
<text x="306" y="250" text-anchor="end" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:bold" fill="#e9fbe9">GND</text>
<rect x="60" y="282" width="34" height="22" rx="4" fill="#adb5bd"/>
<text x="104" y="298" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold" fill="#ffb3b3">own USB port: leave unplugged</text>
<rect x="620" y="110" width="270" height="200" rx="10" fill="#1c4f8a" stroke="#123259" stroke-width="2"/>
<text x="640" y="140" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold" fill="#fff">USB-to-serial adapter</text>
<text x="640" y="160" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:12px" fill="#cfe2ff">3.3 V logic (CP2102 / CH340 / FT232)</text>
<rect x="608" y="176" width="24" height="18" rx="3" fill="#ced4da"/>
<text x="642" y="190" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:bold" fill="#fff">RX</text>
<rect x="608" y="236" width="24" height="18" rx="3" fill="#ced4da"/>
<text x="642" y="250" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:bold" fill="#fff">GND</text>
<rect x="608" y="201" width="24" height="18" rx="3" fill="#ced4da"/>
<text x="642" y="215" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:bold" fill="#9bb8dc">TX  — not connected</text>
<rect x="608" y="261" width="24" height="18" rx="3" fill="#ced4da"/>
<text x="642" y="275" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:bold" fill="#9bb8dc">VCC  — not connected</text>
<rect x="890" y="195" width="46" height="30" rx="5" fill="#adb5bd"/>
<path d="M 936 210 L 975 210" stroke="#555" stroke-width="5"/>
<text x="955" y="187" text-anchor="middle" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:12px" fill="#333">to computer</text>
<path d="M 344 185 L 608 185" stroke="#1971c2" stroke-width="4" fill="none"/>
<path d="M 344 245 L 608 245" stroke="#111418" stroke-width="4" fill="none"/>
<text x="476" y="176" text-anchor="middle" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold" fill="#1971c2">L1  data (ESP32 → computer)</text>
<text x="476" y="236" text-anchor="middle" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold" fill="#111">L2  common ground</text>
<text x="30" y="358" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:12px" fill="#666">115 200 baud, 8N1. The console only listens. Optional and not yet tested on hardware — see docs/LIVE_LINK.md.</text>
</svg>
