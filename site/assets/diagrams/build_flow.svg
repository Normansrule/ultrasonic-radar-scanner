<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 330" width="1250" height="330" role="img" aria-label="Build stages with gate checks">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker></defs>
<rect width="1250" height="330" fill="#ffffff"/>
<text x="30" y="40" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:22px;font-weight:bold" fill="#111">Build stages — do not skip a gate</text>
<text x="30" y="64" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:13px" fill="#555">Each stage has a pass/fail gate. Record the result in docs/VALIDATION.md before moving right. A failed gate means: adjust the named VERIFY variable, re-render, repeat.</text>
<rect x="30" y="90" width="216" height="210" rx="12" fill="#f3faf5" stroke="#2f9e44" stroke-width="2"/>
<circle cx="56" cy="118" r="15" fill="#2f9e44"/>
<text x="56" y="123" text-anchor="middle" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold" fill="#fff">1</text>
<text x="80" y="118" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold" fill="#10331f">Fit coupon</text>
<text x="80" y="136" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11.5px" fill="#4b6355">print 05 first (≈ 20 min)</text>
<text x="44" y="172" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold" fill="#666">GATE</text>
<rect x="44" y="184" width="14" height="14" rx="3" fill="#fff" stroke="#2f9e44"/>
<text x="66" y="196" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11.5px" fill="#222">CYD pegs: snug, not loose</text>
<rect x="44" y="214" width="14" height="14" rx="3" fill="#fff" stroke="#2f9e44"/>
<text x="66" y="226" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11.5px" fill="#222">sensor cans press in</text>
<rect x="44" y="244" width="14" height="14" rx="3" fill="#fff" stroke="#2f9e44"/>
<text x="66" y="256" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11.5px" fill="#222">servo screw pilots bite</text>
<line x1="250" y1="195" x2="270" y2="195" stroke="#2f9e44" stroke-width="3" marker-end="url(#ar)"/>
<rect x="274" y="90" width="216" height="210" rx="12" fill="#f3faf5" stroke="#2f9e44" stroke-width="2"/>
<circle cx="300" cy="118" r="15" fill="#2f9e44"/>
<text x="300" y="123" text-anchor="middle" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold" fill="#fff">2</text>
<text x="324" y="118" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold" fill="#10331f">Bench: wire + flash</text>
<text x="324" y="136" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11.5px" fill="#4b6355">nothing printed yet</text>
<text x="288" y="172" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold" fill="#666">GATE</text>
