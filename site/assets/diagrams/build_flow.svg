<text x="310" y="226" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11.5px" fill="#222">grid + sweep on screen</text>
<rect x="288" y="244" width="14" height="14" rx="3" fill="#fff" stroke="#2f9e44"/>
<text x="310" y="256" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11.5px" fill="#222">echo at a known distance</text>
<line x1="494" y1="195" x2="514" y2="195" stroke="#2f9e44" stroke-width="3" marker-end="url(#ar)"/>
<rect x="518" y="90" width="216" height="210" rx="12" fill="#f3faf5" stroke="#2f9e44" stroke-width="2"/>
<circle cx="544" cy="118" r="15" fill="#2f9e44"/>
<text x="544" y="123" text-anchor="middle" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold" fill="#fff">3</text>
<text x="568" y="118" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold" fill="#10331f">Print</text>
<text x="568" y="136" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11.5px" fill="#4b6355">P1 shell, P2 bezel/base/head</text>
<text x="532" y="172" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold" fill="#666">GATE</text>
