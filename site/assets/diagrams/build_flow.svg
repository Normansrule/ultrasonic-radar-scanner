<text x="554" y="196" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11.5px" fill="#222">no supports needed</text>
<rect x="532" y="214" width="14" height="14" rx="3" fill="#fff" stroke="#2f9e44"/>
<text x="554" y="226" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11.5px" fill="#222">bezel slides in grooves</text>
<rect x="532" y="244" width="14" height="14" rx="3" fill="#fff" stroke="#2f9e44"/>
<text x="554" y="256" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11.5px" fill="#222">base clicks in</text>
<line x1="738" y1="195" x2="758" y2="195" stroke="#2f9e44" stroke-width="3" marker-end="url(#ar)"/>
<rect x="762" y="90" width="216" height="210" rx="12" fill="#f3faf5" stroke="#2f9e44" stroke-width="2"/>
<circle cx="788" cy="118" r="15" fill="#2f9e44"/>
<text x="788" y="123" text-anchor="middle" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold" fill="#fff">4</text>
<text x="812" y="118" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold" fill="#10331f">Assemble</text>
<text x="812" y="136" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11.5px" fill="#4b6355">CENTER_ONLY = true first</text>
<text x="776" y="172" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold" fill="#666">GATE</text>
