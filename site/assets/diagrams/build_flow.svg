<text x="798" y="226" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11.5px" fill="#222">head turns ±60° freely</text>
<rect x="776" y="244" width="14" height="14" rx="3" fill="#fff" stroke="#2f9e44"/>
<text x="798" y="256" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11.5px" fill="#222">cables don't snag</text>
<line x1="982" y1="195" x2="1002" y2="195" stroke="#2f9e44" stroke-width="3" marker-end="url(#ar)"/>
<rect x="1006" y="90" width="216" height="210" rx="12" fill="#f3faf5" stroke="#2f9e44" stroke-width="2"/>
<circle cx="1032" cy="118" r="15" fill="#2f9e44"/>
<text x="1032" y="123" text-anchor="middle" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold" fill="#fff">5</text>
<text x="1056" y="118" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold" fill="#10331f">Run + record</text>
<text x="1056" y="136" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11.5px" fill="#4b6355">CENTER_ONLY = false</text>
<text x="1020" y="172" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold" fill="#666">GATE</text>
<rect x="1020" y="184" width="14" height="14" rx="3" fill="#fff" stroke="#2f9e44"/>
<text x="1042" y="196" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11.5px" fill="#222">sweep matches roof ticks</text>
<rect x="1020" y="214" width="14" height="14" rx="3" fill="#fff" stroke="#2f9e44"/>
<text x="1042" y="226" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11.5px" fill="#222">no resets at servo start</text>
<rect x="1020" y="244" width="14" height="14" rx="3" fill="#fff" stroke="#2f9e44"/>
<text x="1042" y="256" style="font-family:'DejaVu Sans',Helvetica,Arial,sans-serif;font-size:11.5px" fill="#222">log in VALIDATION.md</text>
